<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" width="1040" height="390" role="img" aria-labelledby="t d">
<title id="t">Pokémon Gym &amp; Battle System architecture</title>
<desc id="d">The browser front end calls an Express 5 REST API with a JWT. The API runs as a Vercel serverless function, checks the token, ownership or admin rights and rate limits, then reads and writes 13 PostgreSQL tables on Neon. Each shop purchase runs as one database transaction. A separate browser demo answers the same routes in the page.</desc>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c574f"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c574f"/></marker>
</defs>
<rect width="1040" height="390" rx="18" fill="#f5f2ec"/>
<g><rect x="24" y="24" width="250" height="163" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4"/>
<text x="40" y="46" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">CLIENT</text>
<text x="40" y="67" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Browser</text>
<text x="40" y="94" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">HTML, CSS and vanilla JavaScript</text>
<text x="40" y="113" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Battle, shop, team, Pokédex pages</text>
<text x="40" y="132" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Keeps the JWT from /login</text>
<text x="40" y="151" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Sends Authorization: Bearer</text>
<text x="40" y="170" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Static files served by Vercel's CDN</text>
</g>
<g><rect x="24" y="236" width="250" height="125" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="40" y="258" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">GITHUB PAGES</text>
<text x="40" y="279" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Browser demo</text>
<text x="40" y="306" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">demo/mock-api.js answers /api</text>
<text x="40" y="325" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Real battle engine, localStorage</text>
<text x="40" y="344" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">No server or sign-up</text>
</g>
<g><rect x="354" y="24" width="332" height="277" rx="14" fill="#fbefe1" stroke="#b45a1f" stroke-width="1.4"/>
<text x="370" y="46" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">API · VERCEL FUNCTION, SIN1</text>
<text x="370" y="67" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Express 5 REST API</text>
<text x="370" y="94" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">verifyToken → verifyOwner / verifyAdmin</text>
<text x="370" y="113" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">rateLimit: shared counters in Postgres</text>
<text x="370" y="132" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">routes → controllers → models</text>
<text x="370" y="151" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">battleEngine.js: damage, types, priority</text>
<text x="370" y="170" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">POST /api/register · /login · /demo</text>
<text x="370" y="189" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">POST /api/battle/start</text>
<text x="370" y="208" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">POST /api/battle/:battle_id/turn · /end</text>
<text x="370" y="227" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">POST /api/shop/:user_id/purchase</text>
<text x="370" y="246" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">POST /api/shop/:user_id/daily</text>
<text x="370" y="265" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">PUT  /api/team/:user_id/reorder</text>
<text x="370" y="284" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5c574f">• 49 route handlers in 12 routers</text>
</g>
<g><rect x="766" y="24" width="250" height="239" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4"/>
<text x="782" y="46" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">DATABASE · NEON</text>
<text x="782" y="67" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">PostgreSQL</text>
<text x="782" y="94" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Users, RateLimit</text>
<text x="782" y="113" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Pokemon, Gym, Badge, Shop</text>
<text x="782" y="132" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Battles, UserCompletion</text>
<text x="782" y="151" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">UserPokemon, UserPokedex</text>
<text x="782" y="170" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Team, UserBadge, PullHistory</text>
<text x="782" y="189" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5c574f">• 13 tables from init_tables</text>
<text x="782" y="208" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5c574f">• Purchases lock the Users row</text>
<text x="782" y="227" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">  (SELECT … FOR UPDATE)</text>
<text x="782" y="246" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">  inside BEGIN … COMMIT</text>
</g>
