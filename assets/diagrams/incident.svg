<text x="40" y="46" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">CLIENT</text>
<text x="40" y="67" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Browser</text>
<text x="40" y="94" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Live charts and incident log</text>
<text x="40" y="113" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">HTTP + WebSocket to :8080,</text>
<text x="40" y="132" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">polling if the socket drops</text>
</g>
