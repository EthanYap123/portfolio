<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d">
<title id="t">Incident Monitoring Dashboard architecture</title>
<desc id="d">Five Docker Compose containers. The simulator posts metric batches to the collector every two seconds. The collector, an Express and WebSocket service, runs the alert engine, stores samples, incidents, webhook deliveries and alert rules in PostgreSQL, sends incident webhooks with retries to the webhook receiver and pushes changes over /ws. nginx serves the Next.js dashboard and proxies /api and /ws to the collector, so the browser talks to one origin.</desc>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c574f"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c574f"/></marker>
</defs>
<rect width="1040" height="470" rx="18" fill="#f5f2ec"/>
