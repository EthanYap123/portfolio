<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d">
<title id="t">Tech Trend Sentiment Tracker architecture</title>
<desc id="d">Every six hours a GitHub Actions cron restores the SQLite database from the data branch, runs the Python ETL pipeline over Hacker News, DEV.to and six RSS feeds, saves the database back, exports a snapshot and deploys the static Next.js dashboard to GitHub Pages, which answers queries in the browser. Run locally, a FastAPI backend with APScheduler serves the same queries from SQLite.</desc>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c574f"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c574f"/></marker>
</defs>
<rect width="1040" height="470" rx="18" fill="#f5f2ec"/>
<g><rect x="24" y="24" width="220" height="163" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4"/>
<text x="40" y="46" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">NO API KEYS</text>
<text x="40" y="67" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Sources</text>
<text x="40" y="94" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Hacker News (Algolia API)</text>
<text x="40" y="113" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">DEV.to API</text>
<text x="40" y="132" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">6 RSS feeds: TechCrunch,</text>
<text x="40" y="151" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">The Verge, Ars Technica,</text>
<text x="40" y="170" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">CNBC Tech, Wired, Engadget</text>
</g>
<g><rect x="314" y="24" width="340" height="163" rx="14" fill="#fbefe1" stroke="#b45a1f" stroke-width="1.4"/>
<text x="330" y="46" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">GITHUB ACTIONS CRON · EVERY 6 H</text>
<text x="330" y="67" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Python ETL pipeline</text>
<text x="330" y="94" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Extract: sources.py, each source can fail alone</text>
<text x="330" y="113" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Transform: pandas clean + de-duplicate</text>
<text x="330" y="132" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">VADER + tech and markets lexicon</text>
<text x="330" y="151" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">11 sectors, 37 tracked terms</text>
<text x="330" y="170" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Load: upserts, 90-day retention, run log</text>
</g>
<g><rect x="724" y="24" width="292" height="144" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4"/>
<text x="740" y="46" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">ORPHAN DATA BRANCH</text>
<text x="740" y="67" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">SQLite</text>
<text x="740" y="94" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">articles</text>
<text x="740" y="113" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">article_keywords</text>
<text x="740" y="132" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">pipeline_runs</text>
<text x="740" y="151" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Restored before, pushed after a run</text>
</g>
<g><rect x="724" y="266" width="292" height="106" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4"/>
<text x="740" y="288" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">EXPORT.PY</text>
<text x="740" y="309" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">snapshot.json</text>
<text x="740" y="336" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Every stored article, column-packed</text>
<text x="740" y="355" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Built into the Pages artifact</text>
</g>
<g><rect x="314" y="266" width="340" height="125" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4"/>
<text x="330" y="288" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">GITHUB PAGES</text>
<text x="330" y="309" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Next.js dashboard</text>
<text x="330" y="336" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Recharts trend, sector and keyword charts</text>
<text x="330" y="355" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">analytics.js answers queries in the browser</text>
<text x="330" y="374" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Parity test against analytics.py</text>
</g>
<g><rect x="24" y="266" width="220" height="144" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="40" y="288" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">LOCAL / API MODE</text>
<text x="40" y="309" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">FastAPI</text>
<text x="40" y="336" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">APScheduler runs the pipeline</text>
<text x="40" y="355" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">GET /api/summary</text>
<text x="40" y="374" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">GET /api/sentiment/timeseries</text>
<text x="40" y="393" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">GET /api/keywords · /sectors</text>
</g>
