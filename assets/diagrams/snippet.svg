<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d">
<title id="t">AI Code Snippet &amp; Documentation Hub architecture</title>
<desc id="d">The browser calls Next.js route handlers, which validate the request, save the snippet and queue a job, then respond at once. After the response, a worker claims the job with FOR UPDATE SKIP LOCKED, asks Gemini for documentation, tags and a 768-dimension embedding (or uses the offline engine), and saves them. Postgres with pgvector holds snippets, tags, documentation, embeddings with an HNSW index, the job queue and the free-tier counters.</desc>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c574f"/></marker>
<marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c574f"/></marker>
</defs>
<rect width="1040" height="470" rx="18" fill="#f5f2ec"/>
<g><rect x="24" y="24" width="230" height="144" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4"/>
<text x="40" y="46" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">CLIENT</text>
<text x="40" y="67" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Browser</text>
<text x="40" y="94" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Next.js client components</text>
<text x="40" y="113" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">SWR, CodeMirror, Shiki</text>
<text x="40" y="132" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Polls a snippet every 1.5 s</text>
<text x="40" y="151" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">while its job is running</text>
</g>
<g><rect x="334" y="24" width="340" height="201" rx="14" fill="#fbefe1" stroke="#b45a1f" stroke-width="1.4"/>
<text x="350" y="46" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">VERCEL · NEXT.JS 16 APP ROUTER</text>
<text x="350" y="67" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Route handlers</text>
<text x="350" y="94" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Zod validation, per-visitor rate limits</text>
<text x="350" y="113" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">POST /api/snippets   → 201 at once</text>
<text x="350" y="132" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">GET  /api/snippets/:id</text>
<text x="350" y="151" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">GET  /api/search?q=…</text>
<text x="350" y="170" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">POST /api/snippets/:id/reprocess</text>
<text x="350" y="189" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">GET  /api/tags · /api/stats</text>
<text x="350" y="208" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#3d3a34">GET  /api/worker  (daily cron)</text>
</g>
<g><rect x="334" y="290" width="340" height="125" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4"/>
<text x="350" y="312" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">AFTER() THE RESPONSE IS SENT</text>
<text x="350" y="333" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Background worker</text>
<text x="350" y="360" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Claims a job: FOR UPDATE SKIP LOCKED</text>
<text x="350" y="379" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Retries 429, 5xx and timeouts with backoff</text>
<text x="350" y="398" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Validates LLM output with Zod</text>
</g>
<g><rect x="754" y="24" width="262" height="201" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4"/>
<text x="770" y="46" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">NEON</text>
<text x="770" y="67" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Postgres + pgvector</text>
<text x="770" y="94" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">users, snippets</text>
<text x="770" y="113" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">tags, snippet_tags</text>
<text x="770" y="132" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">documentation</text>
<text x="770" y="151" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">snippet_embeddings</text>
<text x="770" y="170" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">  vector(768), HNSW index</text>
<text x="770" y="189" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">jobs  (the queue)</text>
<text x="770" y="208" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">ai_usage, rate_limits</text>
</g>
<g><rect x="754" y="316" width="262" height="125" rx="14" fill="#ffffff" stroke="#d9d4cb" stroke-width="1.4"/>
<text x="770" y="338" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing=".8" fill="#94481a">ENGINE</text>
<text x="770" y="359" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1c1b18">Gemini or offline</text>
<text x="770" y="386" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Structured docs + embeddings</text>
<text x="770" y="405" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">Offline engine if no key, no budget</text>
<text x="770" y="424" font-family="'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3d3a34">or three failures</text>
</g>
